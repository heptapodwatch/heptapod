events {}
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Native WebSocket clients cannot override Host when connecting via the loopback proof port.
    map $http_upgrade $forwarded_host {
        default $http_host;
        websocket monitor.example.com:8443;
    }
    # Re-resolve app per request: a recreated container may get a new address (rootless Podman always does).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=2s;
    server {
        listen 80;
        set $app_upstream http://app:8080;
        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_pass $app_upstream;
            proxy_set_header Host $forwarded_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
