name: Feature request
description: Propose an improvement to Heptapod.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What monitoring, reporting or notification task is difficult? Use synthetic examples.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable statements. One per line.
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Related changes this request does not include.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing features or workarounds, if relevant.
  - type: textarea
    id: scope
    attributes:
      label: Scope and verification
      description: Which parts of Heptapod are affected, and how could a contributor verify the result?
