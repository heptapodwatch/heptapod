name: Release bundle

# Publishes a draft release: attaches the server agent assets, attaches and verifies its bundle, tags its images vX.Y.Z,
# then makes it public, so releases/latest never names a release without its bundle. Rerun for a published release to
# re-attach the assets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (a draft or published GitHub release) to build, attach and publish the bundle for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-bundle-${{ inputs.tag }}

jobs:
  # A failing agent test or build stops the bundle job, so the release is never published without the agent assets.
  agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Detect the server agent in the tag
        id: source
        run: |
          if [ -f agent/go.mod ]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG predates the server agent; no agent assets attached."
            echo present=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.source.outputs.present == 'true'
        with:
          go-version-file: agent/go.mod
          cache: false
      - name: Test and build the agent assets
        if: steps.source.outputs.present == 'true'
        run: |
          (cd agent && go vet ./... && go test -count=1 -shuffle=on ./...)
          sh agent/build.sh "${TAG#v}" "$RUNNER_TEMP/agent"
          test "$("$RUNNER_TEMP/agent/heptapod-agent-linux-amd64" --version)" = "${TAG#v}"
      - name: Attest the agent assets
        # Private repositories require Enterprise Cloud for GitHub attestations.
        if: steps.source.outputs.present == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/agent/heptapod-agent-linux-amd64
            ${{ runner.temp }}/agent/heptapod-agent-linux-arm64
            ${{ runner.temp }}/agent/install.sh
      - name: Attach the agent assets to the release
        if: steps.source.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/agent"
          gh release upload "$TAG" heptapod-agent-linux-amd64 heptapod-agent-linux-arm64 install.sh SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
      # The install script's own check on the attached assets.
      - name: Verify the attached agent assets
        if: steps.source.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/agent-attached"
          cd "$RUNNER_TEMP/agent-attached"
          gh release download "$TAG" --pattern 'heptapod-agent-linux-*' --pattern install.sh --pattern SHA256SUMS --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS

  bundle:
    needs: agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # The installer's own check: pull both images for the tag commit and verify their revision labels.
      - name: Require the published images of the tag commit
        run: |
          if ! sh -ec 'release_dir=$PWD; . ./scripts/release-image.sh; release_checkout; resolve_release_images true'; then
            echo "::error::Images for $TAG ($(git rev-parse HEAD)) are not published. Wait for Production images on main to publish this commit, then run this workflow manually for $TAG."
            exit 1
          fi
      # The pull above proves only the runner's architecture. The hosted installer accepts arm64 hosts for every
      # release from v0.5.0 on, so those releases must publish both; older releases are amd64 only.
      - name: Require amd64 and arm64 images of the tag commit
        run: |
          if [ "$(printf '%s\n' v0.5.0 "$TAG" | sort -V | head -n 1)" != v0.5.0 ]; then
            echo "::notice::$TAG predates arm64 images; only the amd64 images were checked."
            exit 0
          fi
          for image in app lighthouse; do
            reference="$(bash scripts/image-reference.sh "$image"):$(git rev-parse HEAD)"
            if ! docker manifest inspect "$reference" | jq -e '[.manifests[]?.platform | select(.os == "linux") | .architecture] | index("amd64") != null and index("arm64") != null' > /dev/null; then
              echo "::error::$reference has no linux/amd64 and linux/arm64 index. Publish both architectures (HEPTAPOD_IMAGE_ARCHES) before attaching the bundle for $TAG."
              exit 1
            fi
          done
      - name: Build the bundle
        run: bash scripts/build-release-bundle.sh "$TAG" "$(git rev-parse HEAD)" "$RUNNER_TEMP/bundle"
      - name: Attach the bundle and its checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/bundle/heptapod-$TAG.tar.gz" "$RUNNER_TEMP/bundle/heptapod-$TAG.tar.gz.sha256" --clobber --repo "$GITHUB_REPOSITORY"
      # The installer's own checks on the attached assets: checksum, then REVISION, RELEASE and MANIFEST.
      - name: Verify the attached bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern "heptapod-$TAG.tar.gz*" --dir "$RUNNER_TEMP/attached" --repo "$GITHUB_REPOSITORY"
          (cd "$RUNNER_TEMP/attached" && sha256sum -c "heptapod-$TAG.tar.gz.sha256" && tar -xzf "heptapod-$TAG.tar.gz")
          unpacked=$RUNNER_TEMP/attached/heptapod-$TAG
          test "$(cat "$unpacked/REVISION")" = "$(git rev-parse HEAD)"
          test "$(cat "$unpacked/RELEASE")" = "$TAG"
          sh -ec '. ./scripts/release-image.sh; validate_bundle_manifest "$1"' sh "$unpacked"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Installs pull by commit; the release tag names the same index so image retention keeps it (v* tags).
      - name: Tag the release images
        run: |
          for image in app lighthouse; do
            reference=$(bash scripts/image-reference.sh "$image")
            digest=$(docker buildx imagetools inspect "$reference:$(git rev-parse HEAD)" --format '{{json .Manifest}}' | jq -er '.digest')
            docker buildx imagetools create --prefer-index=false --tag "$reference:$TAG" "$reference@$digest"
            test "$(docker buildx imagetools inspect "$reference:$TAG" --format '{{json .Manifest}}' | jq -er '.digest')" = "$digest"
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  dispatch-website:
    # Separate runner without a checkout so tag-controlled scripts never share a VM with the cross-repo token.
    # WEBSITE_DISPATCH_TOKEN lives exclusively in the main-restricted GitHub environment `website-dispatch`.
    needs: bundle
    runs-on: ubuntu-latest
    environment: website-dispatch
    permissions: {}
    steps:
      # Optional integration: without the secret the website keeps its docs until its next build.
      - name: Trigger the website docs build
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $TAG (expected vX.Y.Z)"
            exit 1
          fi
          if [ -z "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "::notice::WEBSITE_DISPATCH_TOKEN is not set in environment website-dispatch; the website docs build was not triggered for $TAG."
            exit 0
          fi
          GH_TOKEN="$WEBSITE_DISPATCH_TOKEN" /usr/bin/gh api repos/heptapodwatch/heptapod.website/dispatches -f event_type=app-docs -f "client_payload[ref]=$TAG"
