name: CLA

# pull_request_target runs this file from the base branch with a write token; never check out or run pull request code here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
        && (github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    permissions:
      # Re-runs the failed pull_request_target check after a signing comment.
      actions: write
      # Writes the signatures file on the cla-signatures branch.
      contents: write
      # Comments on and locks the pull request.
      pull-requests: write
    steps:
      # Upstream is archived; this is its last release.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/heptapodwatch/heptapod/blob/main/CLA.md
          path-to-signatures: .github/cla/signatures.json
          # main is protected, so signatures go to an unprotected branch.
          branch: cla-signatures
          allowlist: el-schneider,renovate[bot],release-please[bot],github-actions[bot],dependabot[bot]
