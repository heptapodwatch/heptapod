version: 2

# Libraries: one grouped PR per ecosystem and week for patch/minor updates (composer, npm and
# GitHub Actions ones are auto-merged by dependabot-auto-merge.yml) and one for majors, so a
# major never holds back the rest. Container images: one PR per image, reviewed by hand.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      composer-patch-minor:
        update-types: [patch, minor]
      composer-major:
        update-types: [major]
    ignore:
      # 0.13.51 to 0.13.55 infer property reads on controller parameters (e.g. $check->id) as UnknownType,
      # so scramble:export fails (scripts/check-openapi.php). Drop this once a release exports cleanly again.
      - dependency-name: dedoc/scramble
        versions: ['>=0.13.51']

  - package-ecosystem: npm
    directories: [/, /docker/lighthouse]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm-patch-minor:
        update-types: [patch, minor]
      npm-major:
        update-types: [major]

  - package-ecosystem: gomod
    directory: /docker/lighthouse/proxy
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      gomod-patch-minor:
        update-types: [patch, minor]
      gomod-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions-patch-minor:
        update-types: [patch, minor]
      github-actions-major:
        update-types: [major]

  # Tag and digest pins in the Dockerfiles. One PR per image across all four Dockerfiles.
  - package-ecosystem: docker
    directories: [/docker/dev, /docker/lighthouse, /docker/php-base, /docker/prod]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docker-images:
        group-by: dependency-name

  # compose.yaml, compose.prod.yaml and compose.proxy.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      # Built locally from docker/lighthouse, not pulled from a registry.
      - dependency-name: heptapod-lighthouse
