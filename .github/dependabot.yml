version: 2

# One grouped PR per ecosystem and week for patch/minor updates (auto-merged by
# dependabot-auto-merge.yml) and one for majors, so a major never holds back the rest.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      composer-patch-minor:
        update-types: [patch, minor]
      composer-major:
        update-types: [major]

  - package-ecosystem: npm
    directories: [/, /docker/lighthouse]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      npm-patch-minor:
        update-types: [patch, minor]
      npm-major:
        update-types: [major]

  - package-ecosystem: gomod
    directory: /docker/lighthouse/proxy
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      gomod-patch-minor:
        update-types: [patch, minor]
      gomod-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions-patch-minor:
        update-types: [patch, minor]
      github-actions-major:
        update-types: [major]

  # Tag and digest pins in the Dockerfiles.
  - package-ecosystem: docker
    directories: [/docker/dev, /docker/lighthouse, /docker/php-base, /docker/prod]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      docker-patch-minor:
        update-types: [patch, minor]
      docker-major:
        update-types: [major]

  # compose.yaml, compose.prod.yaml and compose.proxy.yaml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      # Built locally from docker/lighthouse, not pulled from a registry.
      - dependency-name: heptapod-lighthouse
    groups:
      docker-compose-patch-minor:
        update-types: [patch, minor]
      docker-compose-major:
        update-types: [major]
