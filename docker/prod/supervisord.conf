[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/heptapod/supervisord.pid

[unix_http_server]
file=/tmp/heptapod/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/heptapod/supervisor.sock

[eventlistener:fatal-exit]
command=sh /app/docker/prod/fatal-exit.sh
events=PROCESS_STATE_FATAL
priority=1
startsecs=0
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:horizon]
environment=PHP_INI_SCAN_DIR="%(ENV_HEPTAPOD_WORKER_PHP_INI_SCAN_DIR)s"
command=php /app/artisan horizon
startsecs=5
startretries=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=1245
stopasgroup=true
killasgroup=true

[program:dispatcher]
command=php /app/artisan heptapod:dispatch
startsecs=5
startretries=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=15
stopasgroup=true
killasgroup=true

[program:scheduler]
environment=PHP_INI_SCAN_DIR="%(ENV_HEPTAPOD_WORKER_PHP_INI_SCAN_DIR)s"
command=php /app/artisan schedule:work
startsecs=5
startretries=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=150
stopasgroup=true
killasgroup=true

[group:workers]
programs=horizon,dispatcher,scheduler
