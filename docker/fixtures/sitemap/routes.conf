# Sitemap addon file-format and guarded discovery cases.
location = /sitemap/file.xml.gz { alias /fixtures/sitemap/file.xml.gz; }
location = /sitemap/encoded.xml.gz {
    alias /fixtures/sitemap/file.xml.gz;
    add_header Content-Encoding gzip;
}
location = /sitemap/bomb.xml.gz { alias /fixtures/sitemap/bomb.xml.gz; }
location = /sitemap/security.xml {
    default_type application/xml;
    content_by_lua_block {
        local base = 'http://' .. ngx.var.http_host
        local external = 'http://' .. ngx.var.http_host:gsub('^fixtures%.test', 'external.fixtures.test')
        ngx.say('<urlset><url><loc>' .. base .. '/sitemap/private-redirect</loc></url><url><loc>' .. external .. '/private</loc></url></urlset>')
    }
}
location = /sitemap/private-redirect {
    content_by_lua_block {
        ngx.redirect('http://' .. ngx.var.http_host:gsub('^fixtures%.test', 'external.fixtures.test') .. '/private')
    }
}
