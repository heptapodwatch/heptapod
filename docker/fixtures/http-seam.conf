# Bounded offline adversarial transport fixtures; no external network or load loop.
location ~ ^/http-seam/overlap/([a-f0-9-]+)/[1-5]$ {
    content_by_lua_block {
        local token = ngx.var[1]
        local store = ngx.shared.crawl_addon
        local active = assert(store:incr('overlap-' .. token, 1, 0, 30))
        store:set('overlap-peak-' .. token, math.max(active, store:get('overlap-peak-' .. token) or 0), 30)
        local deadline = ngx.now() + 3
        while (store:get('overlap-peak-' .. token) or 0) < 5 and ngx.now() < deadline do
            ngx.sleep(0.01)
        end
        ngx.sleep(0.1)
        store:incr('overlap-' .. token, -1)
        ngx.status = (store:get('overlap-peak-' .. token) or 0) >= 5 and 200 or 504
        ngx.say('overlap')
    }
}
location ~ ^/http-seam/overlap-peak/([a-f0-9-]+)$ {
    content_by_lua_block { ngx.say(ngx.shared.crawl_addon:get('overlap-peak-' .. ngx.var[1]) or 0) }
}
location = /http-seam/wire-stream {
    content_by_lua_block {
        for i = 1, 80 do
            ngx.print(string.rep('x', 1024))
            ngx.flush(true)
        end
    }
}
location = /http-seam/slow-not-found {
    content_by_lua_block {
        ngx.sleep(0.1)
        ngx.status = 404
        ngx.say('Not found fixture.')
    }
}
location = /http-seam/not-modified {
    header_filter_by_lua_block { ngx.header["Content-Length"] = 2097152 }
    return 304;
}
location ~ ^/http-seam/large/(200|401|503)$ {
    content_by_lua_block {
        ngx.status = tonumber(ngx.var.uri:match("(%d+)$"))
        ngx.print(string.rep("A", 2 * 1024 * 1024))
    }
}
location ~ ^/http-seam/compressed/(gzip|deflate|br)/(200|503)$ {
    content_by_lua_block {
        local encoding, status = ngx.var.uri:match("/compressed/(%w+)/(%d+)$")
        ngx.status = tonumber(status)
        ngx.header["Content-Encoding"] = encoding
        local file = assert(io.open("/fixtures/site/http-seam-" .. encoding, "rb"))
        local bytes = file:read("*a")
        file:close()
        ngx.print(bytes)
    }
}
location ~ ^/http-seam/slow-redirect/([12])$ {
    content_by_lua_block {
        ngx.sleep(0.7)
        ngx.redirect(ngx.var.uri:sub(-1) == "1" and "/http-seam/slow-redirect/2" or "/status/200", 302)
    }
}
location = /http-seam/drip {
    content_by_lua_block {
        for i = 1, 20 do
            ngx.print("a")
            ngx.flush(true)
            ngx.sleep(0.1)
        end
    }
}
location = /http-seam/error {
    default_type application/json;
    add_header PRIVATE-TOKEN PRIVATE-TOKEN always;
    add_header X-Echo PRIVATE-TOKEN always;
    add_header 123456 value always;
    return 503 '{"PRIVATE-TOKEN":"Private-Token","123456":"value"}';
}
location = /http-seam/escaped-error {
    default_type application/json;
    content_by_lua_block {
        ngx.status = 500
        ngx.print([=[{"\u0070rivate-token":"\u0050RIVATE-TOKEN","\u003123456":"value"}]=])
    }
}
location = /http-seam/accepted-401 { return 401 'private-token expected keyword'; }
location = /http-seam/headers {
    default_type application/json;
    content_by_lua_block { ngx.say(require("cjson").encode(ngx.req.get_headers())) }
}
location = /http-seam/return-origin { return 302 http://external.fixtures.test/http-seam/return-origin; }
location = /http-seam/same-origin { return 302 /http-seam/headers; }
location ~ ^/http-seam/dispatch/[a-z0-9-]+$ {
    content_by_lua_block {
        local key = ngx.var.uri:match("([^/]+)$")
        ngx.shared.webhook_receipts:incr("http-seam-" .. key, 1, 0, 60)
        ngx.say("dispatched")
    }
}
location ~ ^/http-seam/dispatch-count/[a-z0-9-]+$ {
    content_by_lua_block {
        local key = ngx.var.uri:match("([^/]+)$")
        ngx.say(ngx.shared.webhook_receipts:get("http-seam-" .. key) or 0)
    }
}
location = /http-seam/multilayered {
    content_by_lua_block {
        ngx.header["Content-Encoding"] = "gzip, br"
        local file = assert(io.open("/fixtures/site/http-seam-multilayered", "rb"))
        local bytes = file:read("*a")
        file:close()
        ngx.print(bytes)
    }
}
location = /http-seam/truncated {
    content_by_lua_block {
        ngx.status = 503
        ngx.header["Content-Length"] = 1000
        ngx.print("PRIVATE-TOKEN")
        ngx.flush(true)
        return ngx.exit(ngx.ERROR)
    }
}
location = /http-seam/protocol { return 302 ftp://example.test/private-token; }
location = /http-seam/credentials { return 302 http://private-token:secret@fixtures.test/private; }
location = /http-seam/private { return 302 http://127.0.0.1/private; }
location = /http-seam/rebind { return 302 http://rebound.test/private; }
location = /http-seam/cross-host { return 302 http://external.fixtures.test/http-seam/headers; }
location = /http-seam/loop { return 302 /http-seam/loop; }

location ~ ^/http-seam/body-redirect/(301|302|303|307|308)$ {
    content_by_lua_block {
        ngx.status = tonumber(ngx.var[1])
        ngx.header.Location = 'http://external.fixtures.test/http-seam/headers'
        return ngx.exit(ngx.status)
    }
}

location = /http-seam/oversized/200 {
    content_by_lua_block { ngx.print(string.rep('A', 11 * 1024 * 1024)) }
}
location = /http-seam/final-query { return 302 /status/200?token=URL-SECRET; }
location = /http-seam/gzip-oversized/200 {
    add_header Content-Encoding gzip;
    alias /fixtures/site/http-seam-gzip-oversized;
}
location ~ ^/http-seam/same-origin-body/(301|302|307|308)$ {
    content_by_lua_block {
        ngx.status = tonumber(ngx.var[1])
        ngx.header.Location = '/http-seam/request-details'
        return ngx.exit(ngx.status)
    }
}
location = /http-seam/request-details {
    default_type application/json;
    content_by_lua_block {
        ngx.req.read_body()
        ngx.say(require('cjson').encode({method = ngx.req.get_method(), body = ngx.req.get_body_data() or ''}))
    }
}
location = /http-seam/healthy-large {
    content_by_lua_block { ngx.print(string.rep('A', 3 * 1024 * 1024)) }
}
