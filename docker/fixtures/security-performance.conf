location = /security-fix/tls-redirect { return 302 https://wrong-host.fixtures.test/status/200; }

location ~ ^/security-fix/crawl/([0-9]+)$ {
    default_type text/html;
    content_by_lua_block {
        ngx.print('<!doctype html><html><head><title>Volume fixture</title></head><body>')
        if tonumber(ngx.var[1]) == 0 then
            for i = 1, 499 do ngx.print('<a href="/security-fix/crawl/' .. i .. '">Page</a>') end
            local external_count = tonumber(ngx.var.arg_external_hosts) or 100
            for i = 1, external_count do
                local host = external_count == 300 and ('host-' .. i .. '.external.fixtures.test') or 'external.fixtures.test'
                ngx.print('<a href="http://' .. host .. '/security-fix/external/' .. i .. '">External</a>')
            end
        end
        ngx.print('</body></html>')
    }
}
location ~ ^/security-fix/external/[0-9]+$ {
    default_type application/octet-stream;
    content_by_lua_block {
        ngx.header['Content-Length'] = 2097153
        ngx.print('Advertised oversized representation')
    }
}
location = /security-fix/sitemap.xml {
    default_type application/xml;
    content_by_lua_block {
        ngx.print('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">')
        for i = 1, 500 do ngx.print('<url><loc>http://fixtures.test/security-fix/page/' .. i .. '</loc></url>') end
        ngx.print('</urlset>')
    }
}
location ~ ^/security-fix/page/[0-9]+$ { return 200 'Reachable'; }
