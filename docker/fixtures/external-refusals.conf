# External link refusal classes; the crawl page lives on fixtures.test:80, the links on the external origin fixtures.test:81.
location = /external-refusals {
    default_type text/html;
    content_by_lua_block {
        ngx.print('<!doctype html><html><head><title>External refusal fixture</title></head><body>')
        for _, name in ipairs({'401', '403', '405', '406', '999', 'challenge-403', 'challenge-400', 'ident-403', 'ident-400', '404-vendor', '410', '418', '503', 'reset', 'slow', 'headers-probe', '401-auth', '451-pxappid'}) do
            ngx.print('<a href="http://fixtures.test:81/external-refusals/' .. name .. '">' .. name .. '</a> ')
        end
        -- Other TLS hosts are private targets for this site; expired/mismatch run through the direct fetch proof.
        ngx.print('<a href="https://fixtures.test:445/">tls-untrusted</a> ')
        ngx.print('<a href="https://fixtures.test:446/">tls-not-yet-valid</a> ')
        ngx.print('<a href="http://fixtures.test:1/">refused</a> ')
        ngx.print('<a href="http://external-refusals-missing.invalid/">dns</a> ')
        ngx.print('<a href="/external-refusals/hop">redirect-hop</a>')
        if ngx.shared.crawl_addon:get('external-refusals:second-run') then
            ngx.print(' <a href="http://fixtures.test:81/external-refusals/new-404">new-404</a> <a href="http://fixtures.test:81/external-refusals/new-403">new-403</a>')
        end
        ngx.print('</body></html>')
    }
}
# Succeeded crawl: only refusals, no broken or unchecked links.
location = /external-refusals/calm {
    default_type text/html;
    return 200 '<!doctype html><html><body><a href="http://fixtures.test:81/bot-protection/challenge">cf</a> <a href="http://fixtures.test:81/external-refusals/403">403</a></body></html>';
}
location = /external-refusals/401-auth { add_header WWW-Authenticate 'Basic realm="members"' always; return 401 'Unauthorized'; }
# PerimeterX application ID alone is identification, not a challenge.
location = /external-refusals/451-pxappid { default_type text/html; return 451 '<html><body><script>window._pxAppId="PX123";</script>Unavailable for legal reasons</body></html>'; }
location = /external-refusals/hop { return 302 http://fixtures.test:81/external-refusals/headers-probe-redirected; }
location = /external-refusals/401 { return 401 'Unauthorized'; }
location = /external-refusals/403 { return 403 'Forbidden'; }
location = /external-refusals/405 { return 405 'Method not allowed'; }
location = /external-refusals/406 { return 406 'Not acceptable'; }
location = /external-refusals/999 { content_by_lua_block { ngx.status = 999; ngx.say('Request denied'); ngx.exit(999) } }
location = /external-refusals/challenge-403 {
    add_header x-datadome protected always;
    default_type text/html;
    return 403 '<html><body><script src="https://ct.captcha-delivery.com/c.js"></script></body></html>';
}
location = /external-refusals/challenge-400 { default_type text/html; return 400 '<html><body>Request unsuccessful. Incapsula incident ID: 123-456</body></html>'; }
location = /external-refusals/ident-403 { add_header x-datadome protected always; return 403 'Forbidden'; }
location = /external-refusals/ident-400 { add_header x-iinfo 12345 always; return 400 'Bad request'; }
location = /external-refusals/404-vendor {
    add_header cf-mitigated challenge always;
    add_header x-datadome protected always;
    default_type text/html;
    return 404 '<html><head><title>Just a moment...</title></head><body>cf-chl captcha-delivery.com</body></html>';
}
# Alert proof: a second crawl adds one new Broken and one new Not verifiable link.
location = /external-refusals/second-run { content_by_lua_block { ngx.shared.crawl_addon:set('external-refusals:second-run', true); ngx.say('Second-run links enabled') } }
location = /external-refusals/new-404 { return 404 'Missing'; }
location = /external-refusals/new-403 { return 403 'Forbidden'; }
location = /external-refusals/410 { return 410 'Gone'; }
location = /external-refusals/418 { return 418 'Teapot'; }
location = /external-refusals/503 { return 503 'Unavailable'; }
location = /external-refusals/reset { return 444; }
location = /external-refusals/slow { content_by_lua_block { ngx.sleep(15); ngx.say('late') } }
location ~ ^/external-refusals/(headers-probe|headers-probe-redirected)$ {
    content_by_lua_block {
        ngx.shared.crawl_addon:set('external-refusals:' .. ngx.var[1], require('cjson').encode(ngx.req.get_headers()))
        ngx.say('Headers recorded')
    }
}
location ~ ^/external-refusals/seen/(headers-probe|headers-probe-redirected)$ {
    default_type application/json;
    content_by_lua_block { ngx.say(ngx.shared.crawl_addon:get('external-refusals:' .. ngx.var[1]) or 'null') }
}
# Failing crawl: one internal 404 plus external refusals.
location = /external-refusals/mixed {
    default_type text/html;
    return 200 '<!doctype html><html><body><a href="/external-refusals/internal-missing">internal</a> <a href="http://fixtures.test:81/external-refusals/403">403</a> <a href="http://fixtures.test:81/external-refusals/405">405</a> <a href="http://fixtures.test:81/external-refusals/flip">flip</a></body></html>';
}
location = /external-refusals/internal-missing { return 404 'Missing'; }
# 404 until /external-refusals/toggle?flag=flip&on=1, then a refusal (a confirmed failure followed by an unconfirmed observation).
location = /external-refusals/flip { content_by_lua_block { ngx.status = ngx.shared.crawl_addon:get('external-refusals:flip') and 403 or 404; ngx.say('flip'); ngx.exit(ngx.status) } }
# Refusal-only pages; calm-c answers 503 while the "down" flag is set (a Check error on the start page).
location ~ ^/external-refusals/calm-(c|d)$ {
    default_type text/html;
    content_by_lua_block {
        if ngx.var[1] == 'c' and ngx.shared.crawl_addon:get('external-refusals:down') then ngx.status = 503; ngx.say('down'); return ngx.exit(503) end
        ngx.print('<!doctype html><html><body><a href="http://fixtures.test:81/external-refusals/403">403</a> <a href="/external-refusals/calm-extra">extra</a></body></html>')
    }
}
# A deeper page: its refusal is reached only by a complete crawl.
# Flags: intbroken adds an internal 404, extbroken adds a genuine external 404 (fixed by flag=fixed).
location = /external-refusals/calm-extra {
    default_type text/html;
    content_by_lua_block {
        ngx.print('<!doctype html><html><body><a href="http://fixtures.test:81/external-refusals/406">406</a>')
        if ngx.shared.crawl_addon:get('external-refusals:intbroken') then ngx.print(' <a href="/external-refusals/internal-missing">internal</a>') end
        if ngx.shared.crawl_addon:get('external-refusals:extbroken') then ngx.print(' <a href="http://fixtures.test:81/external-refusals/fixable">fixable</a>') end
        ngx.print('</body></html>')
    }
}
location = /external-refusals/toggle { content_by_lua_block { ngx.shared.crawl_addon:set('external-refusals:' .. ngx.var.arg_flag, ngx.var.arg_on == '1'); ngx.say(ngx.var.arg_flag .. '=' .. tostring(ngx.var.arg_on == '1')) } }
# Genuine 404 that gets fixed (toggle flag=fixed): genuine-e for the held warning, genuine-f (plus a deeper page) for the capped crawl.
location ~ ^/external-refusals/genuine-(e|f)$ {
    default_type text/html;
    return 200 '<!doctype html><html><body><a href="http://fixtures.test:81/external-refusals/fixable">fixable</a> <a href="/external-refusals/calm-extra">extra</a></body></html>';
}
location = /external-refusals/fixable { content_by_lua_block { ngx.status = ngx.shared.crawl_addon:get('external-refusals:fixed') and 200 or 404; ngx.say('fixable'); ngx.exit(ngx.status) } }
# Crawl refusal coverage: external 404s, refusals, TLS handshake and DNS failures, internal 403/500 pages and an oversized page.
location = /crawl-refusals {
    default_type text/html;
    content_by_lua_block {
        ngx.print('<!doctype html><html><body><a href="/crawl-refusals/forbidden">forbidden</a> <a href="/crawl-refusals/error">error</a> <a href="/crawl-refusals/huge">huge</a> ')
        for i = 1, 3 do ngx.print('<a href="http://fixtures.test:81/crawl-refusals/gone-' .. i .. '">gone</a> ') end
        ngx.print('<a href="/crawl-refusals/calm">calm</a></body></html>')
    }
}
# Not-verifiable links only: refusals, TLS handshake failures and an unresolvable host.
location = /crawl-refusals/calm {
    default_type text/html;
    content_by_lua_block {
        ngx.print('<!doctype html><html><body>')
        for _, name in ipairs({'401', '403', '405', 'challenge-403'}) do ngx.print('<a href="http://fixtures.test:81/external-refusals/' .. name .. '">' .. name .. '</a> ') end
        for i = 1, 3 do ngx.print('<a href="https://fixtures.test:81/crawl-refusals/tls-' .. i .. '">tls</a> ') end
        ngx.print('<a href="http://crawl-refusals-missing.invalid/">dns</a></body></html>')
    }
}
location ~ ^/crawl-refusals/gone-[0-9]+$ { return 404 'Missing'; }
location = /crawl-refusals/forbidden { return 403 'Forbidden'; }
location = /crawl-refusals/error { return 500 'Internal error'; }
location = /crawl-refusals/huge {
    default_type text/html;
    content_by_lua_block { ngx.print('<!doctype html><html><body>' .. string.rep('<p>large</p>', 1000000) .. '</body></html>') }
}
# Oversized-response coverage: only the confirmed non-HTML file keeps the crawl complete.
location = /crawl-refusals/large-set {
    default_type text/html;
    return 200 '<!doctype html><html><body><a href="/crawl-refusals/large/head-405">head-405</a> <a href="/crawl-refusals/large/no-mime">no-mime</a> <a href="/crawl-refusals/large/xhtml">xhtml</a> <a href="/crawl-refusals/large/pdf">pdf</a></body></html>';
}
location = /crawl-refusals/large-pdf-only {
    default_type text/html;
    return 200 '<!doctype html><html><body><a href="/crawl-refusals/large/pdf">pdf</a></body></html>';
}
location ~ ^/crawl-refusals/large/(head-405|no-mime|xhtml|pdf)$ {
    default_type '';
    content_by_lua_block {
        local kind = ngx.var[1]
        if kind == 'head-405' and ngx.req.get_method() == 'HEAD' then return ngx.exit(405) end
        if kind == 'head-405' then ngx.header['Content-Type'] = 'text/html' end
        if kind == 'xhtml' then ngx.header['Content-Type'] = 'application/xhtml+xml' end
        if kind == 'pdf' then ngx.header['Content-Type'] = 'application/pdf' end
        if ngx.req.get_method() == 'HEAD' then return ngx.exit(200) end
        ngx.print(string.rep('<p>large</p>', 1000000))
    }
}
