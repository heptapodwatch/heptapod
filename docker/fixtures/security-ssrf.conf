location ~ ^/security-ssrf/(?:redirect|rdap)/(metadata|private|loopback|same-host|metadata-name|ipv6-link-local|provider-ip|provider-ipv6)(?:/domain/[a-z.]+)?$ {
    content_by_lua_block {
        local targets = {
            metadata = 'http://169.254.169.254/security-ssrf/final',
            private = 'http://10.0.0.5/security-ssrf/final',
            loopback = 'http://127.0.0.1/security-ssrf/final',
            ['same-host'] = ngx.var.arg_format == 'html' and '/security-ssrf/page' or '/security-ssrf/final',
            ['metadata-name'] = 'http://metadata.google.internal/security-ssrf/final',
            ['ipv6-link-local'] = 'http://[fe80::1]/security-ssrf/final',
            ['provider-ip'] = 'http://100.100.100.200/security-ssrf/final',
            ['provider-ipv6'] = 'http://[fd00:ec2::254]/security-ssrf/final'
        }
        local target = targets[ngx.var[1]]
        if ngx.var.uri:find('/rdap/', 1, true) then
            target = target:gsub('/security%-ssrf/final$', '/security-ssrf/rdap-final')
        end
        return ngx.redirect(target, 302)
    }
}
location = /security-ssrf/rdap-final {
    default_type application/rdap+json;
    return 200 '{"objectClassName":"domain","ldhName":"example.com","status":["active"],"events":[{"eventAction":"expiration","eventDate":"2035-01-01T00:00:00Z"}]}';
}
location = /security-ssrf/page {
    default_type text/html;
    return 200 '<!doctype html><html lang="en"><head><title>Redirect fixture</title></head><body><h1>Same-host intranet page</h1></body></html>';
}
location = /security-ssrf/final {
    default_type application/xml;
    return 200 '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>http://fixtures.test/status/200</loc></url></urlset>';
}
