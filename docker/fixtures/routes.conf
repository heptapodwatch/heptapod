location ~ ^/crawl-addon/parallel-status/asset/[0-9]+$ {
    default_type image/png;
    content_by_lua_block {
        local state = ngx.shared.crawl_addon
        local active = assert(state:incr('parallel-status-active', 1, 0))
        state:set('parallel-status-peak', math.max(active, state:get('parallel-status-peak') or 0))
        for i = 1, 30 do
            if (state:get('parallel-status-active') or 0) >= 5 then break end
            ngx.sleep(0.05)
        end
        assert(state:incr('parallel-status-active', -1))
        ngx.say('Asset checked')
    }
}
