location /sitemap-production/ {
    content_by_lua_file /fixtures/sitemap-pacing/production.lua;
    log_by_lua_block {
        local event = ngx.ctx.production_event
        if event then
            ngx.update_time()
            event.finished = ngx.now()
            event.status = ngx.status
            local dict = ngx.shared.production_pacing
            event.active_after = assert(dict:incr(ngx.ctx.production_key .. ':active', -1))
            assert(dict:set(ngx.ctx.production_key .. ':event:' .. event.ordinal, require('cjson').encode(event)))
        end
    }
}

# Application health: dynamic timestamps keep offline observations fresh.
location = /application-health/gzip-oversized {
    default_type application/json;
    add_header Content-Encoding gzip;
    alias /fixtures/site/application-health/oversized.json.gz;
}

location /application-health/ {
    default_type application/json;
    content_by_lua_block {
        if ngx.var.http_oh_dear_health_check_secret ~= 'fixture-secret' then
            ngx.status = 403
            ngx.say('{}')
            return
        end
        local variant = ngx.var.uri:match('/application%-health/(.+)')
        if variant == 'redirect' then
            return ngx.redirect('http://external.fixtures.test/private?token=fixture-secret', 302)
        end
        if variant == 'truncated-503' then
            local socket = assert(ngx.req.socket(true))
            assert(socket:send('HTTP/1.1 503 Service Unavailable\r\nContent-Type: application/json\r\nContent-Length: 1000\r\nConnection: close\r\n\r\nPRIVATE-TOKEN'))
            socket:close()
            return
        end
        if variant == 'timeout' then ngx.sleep(2) end
        if variant == 'invalid' then ngx.say('{invalid'); return end
        if variant == 'oversized' then ngx.say(string.rep('x', 1100000)); return end
        local cjson = require 'cjson'
        local status = variant == 'warning' and 'warning' or (variant == 'failed' and 'failed' or 'ok')
        ngx.say(cjson.encode({
            finishedAt = ngx.time() - (variant == 'stale' and 3600 or 0),
            checkResults = {{name = 'DiskSpace', label = 'Disk space', status = status,
                notificationMessage = 'Disk usage at 70%', shortSummary = '70%',
                meta = {disk_space_used_percentage = 70}}}
        }))
    }
}
# Crawl addon fixtures
location ~ ^/crawl-addon/worker-signal/(page|state|release)$ {
    default_type text/html;
    content_by_lua_block {
        local token = ngx.var.arg_token
        if not token or not ngx.re.match(token, '^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$', 'jo') then
            return ngx.exit(400)
        end
        local key = 'worker-signal-' .. token
        local store = ngx.shared.crawl_addon
        if ngx.var[1] == 'state' then
            ngx.say(store:get(key .. '-active') or 0)
            return
        end
        if ngx.var[1] == 'release' then
            store:set(key .. '-release', true, 15)
            ngx.say('released')
            return
        end
        store:set(key .. '-active', 1, 15)
        local deadline = ngx.now() + 10
        while not store:get(key .. '-release') and ngx.now() < deadline do
            ngx.sleep(0.01)
        end
        store:delete(key .. '-active')
        store:delete(key .. '-release')
        ngx.say('Signal-controlled crawl completed.')
    }
}
location = /crawl-addon/benchmark {
    default_type text/html;
    content_by_lua_block {
        local token = ngx.var.arg_token
        if not token or not token:match('^[a-f0-9-]+$') then return ngx.exit(400) end
        for i = 1, 5 do ngx.say('<a href="/crawl-addon/benchmark/slow-' .. i .. '?token=' .. token .. '">Slow page</a>') end
    }
}
location ~ ^/crawl-addon/benchmark/slow-[1-5]$ {
    default_type text/html;
    content_by_lua_block {
        local token = ngx.var.arg_token
        if not token or not token:match('^[a-f0-9-]+$') then return ngx.exit(400) end
        local store = ngx.shared.crawl_addon
        local active = assert(store:incr('benchmark-' .. token, 1, 0, 30))
        store:set('benchmark-peak-' .. token, math.max(active, store:get('benchmark-peak-' .. token) or 0), 30)
        ngx.sleep(0.1)
        store:incr('benchmark-' .. token, -1)
        ngx.say('Slow page')
    }
}
