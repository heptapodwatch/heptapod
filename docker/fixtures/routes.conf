# Ephemeral per-path receipts for credential-free notification smoke tests.
location ~ ^/webhook/[a-zA-Z0-9-]+$ {
    content_by_lua_block {
        local json = require "cjson"
        local receipts = ngx.shared.webhook_receipts
        ngx.header.content_type = "application/json"
        if ngx.req.get_method() == "POST" then
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            if not body then return ngx.exit(400) end
            local receipt = json.encode({ body = body, headers = ngx.req.get_headers() })
            local stored, err = receipts:safe_set(ngx.var.uri, receipt, 300)
            if not stored then error(err) end
            ngx.say(receipt)
        elseif ngx.req.get_method() == "GET" then
            local receipt = receipts:get(ngx.var.uri)
            if not receipt then return ngx.exit(404) end
            ngx.say(receipt)
        else
            return ngx.exit(405)
        end
    }
}
