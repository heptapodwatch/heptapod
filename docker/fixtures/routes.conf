location = /crawl-addon/reflected {
    default_type text/html;
    content_by_lua_block {
        local headers = ngx.req.get_headers()
        local secret = headers['X-Site-Secret']
        local query = ngx.var.arg_token
        if headers['X-Crawl-Case'] == 'upper' then
            secret = string.upper(secret)
            query = string.upper(query)
        end
        local suffix = headers['X-Crawl-New'] == 'true' and '-new' or ''
        ngx.say('<a href="/crawl-addon/reflected-broken/' .. secret .. suffix .. '?credential=' .. query .. '">' .. secret .. '|' .. query .. '|dact|crawler|[redacted]|public-marker</a>')
        ngx.say('<a href="/crawl-addon/reflected-whitelisted/' .. secret .. '?credential=' .. query .. '">Allowed</a>')
        ngx.say('<img src="http://fixtures.test/' .. secret .. '.png?credential=' .. query .. '">')
    }
}
