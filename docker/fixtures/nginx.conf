worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type text/plain;
    access_log /dev/stdout;
    root /fixtures/site;
    server_tokens off;
    lua_shared_dict webhook_receipts 1m;
    lua_shared_dict crawl_addon 1m;
    lua_shared_dict fixture_config 1m;
    lua_shared_dict production_pacing 16m;
    init_worker_by_lua_block {
        local contents = {}
        for _, path in ipairs({"/fixtures/nginx.conf", "/fixtures/routes.conf"}) do
            local file = assert(io.open(path, "rb"))
            contents[#contents + 1] = assert(file:read("*a"))
            file:close()
        end
        assert(ngx.shared.fixture_config:set("hash", ngx.md5(table.concat(contents, "\0"))))
    }

    include /fixtures/alert-quality-robots.conf;

    server {
        listen 80 default_server;
        server_name fixtures.test;
        include /fixtures/routes.conf;
    }
    server {
        listen 81;
        server_name fixtures.test;
        include /fixtures/bot-protection.conf;
        include /fixtures/external-refusals.conf;
    }
    server {
        listen 80;
        server_name external.fixtures.test;
        include /fixtures/alert-quality.conf;
        include /fixtures/security-performance.conf;
        location = /http-seam/return-origin { return 302 http://fixtures.test/http-seam/headers; }
        location = /http-seam/headers {
            default_type application/json;
            content_by_lua_block {
                ngx.say(require("cjson").encode(ngx.req.get_headers()))
            }
        }
        # Crawl addon: reject leaked site headers and expose redirect security cases.
        location = /crawl-addon/large-chunked {
            content_by_lua_block {
                for i = 1, 64 do ngx.print(string.rep('x', 1024)); ngx.flush(true) end
            }
        }
        location = /crawl-addon/header-check {
            if ($http_x_crawler_secret != '') { return 500 'Site header leaked'; }
            return 200 'No site header received';
        }
        location = /crawl-addon/private-redirect { return 302 http://127.0.0.1/crawl-addon/private; }
        location = / { return 200 'External link works.\n'; }
        location / { return 404 'External link is broken.\n'; }
    }
    server {
        listen 443 ssl default_server;
        server_name fixtures.test;
        ssl_certificate /fixtures/tls/valid.crt;
        ssl_certificate_key /fixtures/tls/valid.key;
        include /fixtures/routes.conf;
    }
    server {
        listen 444 ssl;
        server_name fixtures.test;
        ssl_certificate /fixtures/tls/oversized-chain.crt;
        ssl_certificate_key /fixtures/tls/valid.key;
        include /fixtures/routes.conf;
    }
    server {
        listen 445 ssl;
        server_name fixtures.test;
        ssl_certificate /fixtures/tls/incomplete-chain.crt;
        ssl_certificate_key /fixtures/tls/incomplete-chain.key;
        include /fixtures/routes.conf;
    }
    server {
        listen 446 ssl;
        server_name fixtures.test;
        ssl_certificate /fixtures/tls/not-yet-valid.crt;
        ssl_certificate_key /fixtures/tls/not-yet-valid.key;
        include /fixtures/routes.conf;
    }
    server {
        listen 443 ssl;
        server_name names.fixtures.test wildcard.fixtures.test *.wildcard.fixtures.test alt.fixtures.test;
        ssl_certificate /fixtures/tls/names.crt;
        ssl_certificate_key /fixtures/tls/names.key;
        include /fixtures/routes.conf;
    }
    server {
        listen 443 ssl;
        server_name self-signed.fixtures.test;
        ssl_certificate /fixtures/tls/self-signed.crt;
        ssl_certificate_key /fixtures/tls/self-signed.key;
        include /fixtures/routes.conf;
    }
    server {
        listen 443 ssl;
        server_name expired.fixtures.test;
        ssl_certificate /fixtures/tls/expired.crt;
        ssl_certificate_key /fixtures/tls/expired.key;
        include /fixtures/routes.conf;
    }
    server {
        listen 443 ssl;
        server_name wrong-host.fixtures.test;
        ssl_certificate /fixtures/tls/wrong-host.crt;
        ssl_certificate_key /fixtures/tls/wrong-host.key;
        include /fixtures/routes.conf;
    }
}
