location = /crawl-correctness/noindex-follow {
    default_type text/html;
    return 200 '<!doctype html><meta name="robots" content="noindex,follow"><a href="/crawl-correctness/child">Child</a>';
}
location = /crawl-correctness/noindex-empty {
