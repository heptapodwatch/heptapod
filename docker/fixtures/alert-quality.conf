location = /noindex-completeness/server-error {
    default_type text/html;
    add_header X-Robots-Tag noindex always;
    return 503 '<!doctype html><meta name="robots" content="noindex,nofollow"><title>Server error</title>';
}

# Truthfulness fixtures: per-key state switches one URL between a confirmed failure and an unverified observation.
location = /truth/state {
    content_by_lua_block {
        assert(ngx.shared.crawl_addon:set('truth:' .. assert(ngx.var.arg_key), ngx.unescape_uri(assert(ngx.var.arg_state))))
        ngx.say('OK')
    }
}
location = /truth/target {
    default_type text/html;
    content_by_lua_block {
        local state = ngx.shared.crawl_addon:get('truth:' .. assert(ngx.var.arg_key)) or 'missing'
        if state == 'challenge' then
            ngx.header['cf-mitigated'] = 'challenge'
            ngx.status = 403
            ngx.say('<!doctype html><title>Just a moment...</title><p>Automated checks must pass a challenge.</p>')
        elseif state == 'limited' then ngx.status = 429; ngx.say('Too many requests')
        elseif state == 'ok' then ngx.say('<!doctype html><p>OK</p>')
        else ngx.status = 404; ngx.say('Not found') end
    }
}
location = /truth/page {
    default_type text/html;
    content_by_lua_block {
        ngx.say('<!doctype html><a href="/truth/target?key=' .. ngx.escape_uri(assert(ngx.var.arg_key)) .. '">Target</a>')
    }
}
location = /truth/sitemap.xml {
    default_type application/xml;
    content_by_lua_block {
        local base = 'http://' .. ngx.var.host .. '/truth/target?key='
        ngx.say('<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">')
        for key in string.gmatch(assert(ngx.var.arg_keys), '[^,]+') do ngx.say('<url><loc>' .. base .. key .. '</loc></url>') end
        ngx.say('</urlset>')
    }
}
location = /truth/large.json {
    default_type application/json;
    content_by_lua_block { ngx.print('{"status":"ok","padding":"' .. string.rep('x', 2200000) .. '"}') }
}
location = /truth/health {
    default_type application/json;
    content_by_lua_block {
        local cjson = require 'cjson'
        local state = ngx.shared.crawl_addon:get('truth:' .. assert(ngx.var.arg_key)) or 'ok,ok'
        if state == 'invalid' then ngx.say('{invalid'); return end
        local db, cache, queue = state:match('^([^,]+),([^,]+),?([^,]*)$')
        local results = {
            {name = 'Database', label = 'Database', status = db, notificationMessage = 'Database ' .. db, shortSummary = db, meta = {}},
            {name = 'Cache', label = 'Cache', status = cache, notificationMessage = 'Cache ' .. cache, shortSummary = cache, meta = {}}}
        if queue ~= '' then
            results[3] = {name = 'Queue', label = 'Queue', status = queue, notificationMessage = 'Queue ' .. queue, shortSummary = queue, meta = {}}
        end
        ngx.say(cjson.encode({finishedAt = ngx.time(), checkResults = results}))
    }
}
