    return 200 '<!doctype html><meta name="robots" content="noindex,follow"><p>No links</p>';
}
location = /crawl-correctness/noindex-nofollow {
    default_type text/html;
    return 200 '<!doctype html><meta name="robots" content="noindex,nofollow"><a href="/crawl-correctness/child">Child</a>';
}
location = /crawl-correctness/header-nofollow {
    default_type text/html;
    add_header X-Robots-Tag nofollow;
    return 200 '<!doctype html><a href="/crawl-correctness/child">Child</a>';
}
location = /crawl-correctness/child {
    default_type text/html;
    return 200 '<!doctype html><a href="/crawl-correctness/broken">Broken child</a>';
}
location = /crawl-correctness/broken { return 404; }
location = /crawl-correctness/state {
    content_by_lua_block {
        assert(ngx.shared.crawl_addon:set('correctness:' .. assert(ngx.var.arg_key), assert(ngx.var.arg_state)))
        ngx.say('OK')
    }
}
location = /crawl-correctness/wall {
    default_type text/html;
    content_by_lua_block {
        local state = ngx.shared.crawl_addon:get('correctness:' .. assert(ngx.var.arg_key))
        if state == 'login' then return ngx.redirect('/alert-quality/login', 302) end
        if state == 'broken' then
            ngx.say('<!doctype html><a href="/crawl-correctness/broken">Broken</a><img src="http://fixtures.test/pixel.png">')
        elseif state == 'noindex' then
            ngx.say('<!doctype html><meta name="robots" content="noindex,nofollow"><a href="/crawl-correctness/broken">Not checked</a>')
        elseif state == 'healthy' then
            ngx.say('<!doctype html><p>Healthy</p>')
        else error('Missing proof state') end
    }
}
location = /crawl-correctness/login {
    default_type text/html;
    return 200 '<!doctype html><title>JavaScript sign in</title><div>Login application</div>';
}
location = /crawl-correctness/public-modal {
    default_type text/html;
    return 200 '<!doctype html><input type="password"><a href="/crawl-correctness/child">Public child</a>';
}

location = /noindex-completeness/mixed {
    default_type text/html;
    content_by_lua_block {
        local state = assert(ngx.shared.crawl_addon:get('correctness:' .. assert(ngx.var.arg_key)))
        ngx.say('<!doctype html><title>Mixed content proof</title>')
        if state == 'noindex' or state == 'healthy' then ngx.say('<meta name="robots" content="noindex,follow">') end
        if state == 'nofollow' or state == 'nofollow-healthy' then
            ngx.say('<meta name="robots" content="noindex,nofollow"><a href="/noindex-completeness/traversal-forbidden">Do not follow</a>')
        end
        if state ~= 'healthy' and state ~= 'nofollow-healthy' then ngx.say('<img src="http://fixtures.test/pixel.png">') end
    }
}
location = /noindex-completeness/mixed-link {
    default_type text/html;
    content_by_lua_block {
        local key = assert(ngx.var.arg_key)
        if ngx.shared.crawl_addon:get('correctness:' .. key) == 'parent-nofollow' then ngx.say('<meta name="robots" content="noindex,nofollow">') end
        ngx.say('<!doctype html><a href="/noindex-completeness/mixed?key=' .. key .. '">Mixed child</a>')
    }
}
location = /noindex-completeness/traversal-forbidden { return 404; }
location = /noindex-completeness/missing-link {
