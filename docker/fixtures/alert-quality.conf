# Crawl coverage: seven noindex pages, eight depth exclusions, and a failing state with one new link.
location = /crawl-presentation/root {
    default_type text/html;
    content_by_lua_block {
        ngx.say('<!doctype html><title>Crawl presentation</title>')
        for i = 1, 7 do ngx.say('<a href="/crawl-presentation/noindex/' .. i .. '">Noindex</a>') end
        ngx.say('<a href="/crawl-presentation/depth/1">Chain</a>')
        for i = 1, 2 do ngx.say('<a href="/crawl-presentation/missing/' .. i .. '">Internal missing</a>') end
        local total = ngx.shared.crawl_addon:get('presentation-new') and 5 or 4
        for i = 1, total do ngx.say('<a href="http://fixtures.test/crawl-presentation/missing/' .. i .. '">External missing</a>') end
    }
}
location = /crawl-presentation/warning {
    default_type text/html;
    content_by_lua_block {
        ngx.say('<!doctype html><title>Crawl warning presentation</title>')
        local total = ngx.shared.crawl_addon:get('presentation-new') and 5 or 4
        for i = 1, total do ngx.say('<a href="http://fixtures.test/crawl-presentation/missing/' .. i .. '">External missing</a>') end
    }
}
location ~ ^/crawl-presentation/noindex/[1-7]$ {
    default_type text/html;
    return 200 '<!doctype html><meta name="robots" content="noindex,follow"><a href="/crawl-presentation/root">Home</a>';
}
location ~ ^/crawl-presentation/depth/([1-5])$ {
    default_type text/html;
    content_by_lua_block {
        local depth = tonumber(ngx.var[1])
        if depth < 5 then
            ngx.say('<!doctype html><a href="/crawl-presentation/depth/' .. (depth + 1) .. '">Next</a>')
        else
            for i = 1, 8 do ngx.say('<a href="/crawl-presentation/beyond/' .. i .. '">Beyond depth</a>') end
        end
    }
}
location ~ ^/crawl-presentation/beyond/[1-8]$ { default_type text/html; return 200 '<!doctype html><p>Beyond configured depth</p>'; }
location ~ ^/crawl-presentation/missing/[1-5]$ { return 404; }
location = /crawl-presentation/state {
    content_by_lua_block {
        if ngx.var.arg_new == '1' then assert(ngx.shared.crawl_addon:set('presentation-new', true))
        else ngx.shared.crawl_addon:delete('presentation-new') end
        ngx.say('OK')
    }
}

# Public-page and absence fixtures for alert-quality checks.
# Synthetic credentials: demo:password. No real account or external request is used.
location = /crawl-findings-truth/protected {
    default_type text/html;
    content_by_lua_block {
        if ngx.req.get_headers()["Authorization"] ~= "Basic " .. ngx.encode_base64("demo:password") then
            ngx.status = 401
            ngx.header["WWW-Authenticate"] = 'Basic realm="Crawl proof"'
            return ngx.say('Authentication required')
        end
        ngx.say('<!doctype html><a href="/crawl-correctness/broken">Broken</a><img src="http://fixtures.test/pixel.png">')
    }
}
location = /crawl-findings-truth/root {
    default_type text/html;
    content_by_lua_block {
        local key = assert(ngx.var.arg_key)
        local state = assert(ngx.shared.crawl_addon:get('correctness:' .. key))
        if state == 'login' then return ngx.redirect('/alert-quality/login', 302) end
        if state == 'nofollow' or state == 'nofollow-clean' then ngx.say('<meta name="robots" content="nofollow">') end
        ngx.say('<!doctype html><a href="/crawl-findings-truth/child?key=' .. key .. '">Child</a>')
        if state == 'nofollow' then ngx.say('<img src="http://fixtures.test/root-insecure.png">') end
    }
}
location = /crawl-findings-truth/child {
    default_type text/html;
    return 200 '<!doctype html><img src="http://fixtures.test/child-insecure.png">';
}
location = /alert-quality/public {
    default_type text/html;
    return 200 '<!doctype html><title>Public page</title><p>Public content</p>';
}
location = /alert-quality/noindex {
    default_type text/html;
    return 200 '<!doctype html><meta name="robots" content="noindex,nofollow"><title>Private CMS</title>';
}
location = /alert-quality/login-redirect { return 302 /alert-quality/login; }
location = /alert-quality/cms-redirect { return 302 /cp; }
location = /cp { return 302 /cp/auth/login; }
location = /cp/auth/login {
    default_type text/html;
    return 200 '<!doctype html><meta name="robots" content="noindex,nofollow"><title>CMS sign in</title><div>JavaScript login form</div>';
}
location = /alert-quality/login {
    default_type text/html;
    return 200 '<!doctype html><title>Sign in</title><form><input type="password"><button>Sign in</button></form>';
}
location = /alert-quality/unauthorized { return 401; }
location = /alert-quality/forbidden { return 403; }
location = /alert-quality/non-html { default_type application/json; return 200 '{"service":"backend"}'; }
location = /alert-quality/malformed {
    default_type text/html;
    return 200 '<!doctype html><title>Malformed links</title><a href="/bad%zz">Invalid percent encoding</a><a href="http://[broken">Broken host</a><a href="http://example.test:wrong/">Broken port</a><a href="/alert-quality/public">Valid link</a>';
}
location = /alert-quality/invalid.xml { default_type application/xml; return 200 '<not-a-sitemap>'; }
location = /alert-quality/valid.xml {
    default_type application/xml;
