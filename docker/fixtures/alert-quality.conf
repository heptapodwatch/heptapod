    }
}
location = /alert-quality/broken-three.xml {
    default_type application/xml;
    content_by_lua_block {
        ngx.say('<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">')
        for i = 1, 3 do ngx.say('<url><loc>http://' .. ngx.var.host .. '/alert-quality/missing-' .. i .. '</loc></url>') end
        ngx.say('</urlset>')
    }
}
location = /alert-quality/broken.xml {
    default_type application/xml;
    return 200 '<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>http://fixtures.test/alert-quality/missing-page</loc></url></urlset>';
