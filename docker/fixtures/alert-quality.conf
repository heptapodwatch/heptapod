    return 200 '<!doctype html><a href="/noindex-completeness/missing">Yoast missing page</a><a href="/noindex-completeness/server-error">Server error</a>';
}
location = /noindex-completeness/warning-wall {
    default_type text/html;
    content_by_lua_block {
        local state = assert(ngx.shared.crawl_addon:get('correctness:' .. assert(ngx.var.arg_key)))
        if state == 'login' then return ngx.redirect('/alert-quality/login', 302) end
        assert(state == 'warning')
        ngx.say('<!doctype html><a href="http://external.fixtures.test/crawl-correctness/broken">External missing page</a>')
    }
}
location = /noindex-completeness/missing-only-link {
