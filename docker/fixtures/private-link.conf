# Private-network links on a public-looking page: the guard refuses them per link; the run itself must still succeed.
location = /private-link {
    default_type text/html;
    return 200 '<!doctype html><html lang="en"><head><title>Private link fixture</title><link rel="stylesheet" href="http://10.0.0.5/private-link/style.css"></head><body><h1>Private links</h1><a href="http://10.0.0.5/intranet">intranet</a> <a href="http://169.254.169.254/latest/meta-data/">metadata</a> <a href="http://external.fixtures.test/private-link/named">private-name</a> <a href="/private-link/missing-1">missing 1</a> <a href="/private-link/missing-2">missing 2</a> <a href="http://fixtures.test:81/external-refusals/410">gone</a> <img src="http://169.254.169.254/private-link/pixel.png" alt=""></body></html>';
}
location = /private-link/sitemap.xml {
    default_type application/xml;
    return 200 '<?xml version="1.0" encoding="UTF-8"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>http://fixtures.test/private-link</loc></url><url><loc>http://10.0.0.5/intranet</loc></url><url><loc>http://169.254.169.254/latest/meta-data/</loc></url></urlset>';
}
# An internal 500 page makes discovery incomplete, so the crawl artifact carries a crawl.discovery.* note.
location = /notes-shape {
    default_type text/html;
    return 200 '<!doctype html><html lang="en"><head><title>Notes shape fixture</title></head><body><a href="/status/500">server error</a> <a href="/status/404">missing</a></body></html>';
}
