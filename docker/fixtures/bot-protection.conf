# External fixture origin uses the configured hostname on another port, not an SSRF exception.
location = /bot-protection {
    default_type text/html;
    return 200 '<!doctype html><html><head><title>Bot protection fixture</title></head><body><a href="http://fixtures.test:81/bot-protection/challenge">Cloudflare protected link</a><a href="http://fixtures.test:81/bot-protection/forbidden">Plain forbidden link</a><a href="http://fixtures.test:81/bot-protection/rate-limited">Rate-limited link</a></body></html>';
}
location = /bot-protection/all {
    default_type text/html;
    content_by_lua_block {
        ngx.print('<!doctype html><html><head><title>All protection signals</title></head><body>')
        for _, name in ipairs({'challenge', 'cf-body', 'cf-title', 'waf', 'waf-marker', 'akamai', 'sucuri', 'sucuri-server', 'sucuri-heading', 'imperva', 'imperva-cookie', 'imperva-body', 'datadome', 'datadome-b', 'rate-limited', 'forbidden', 'sucuri-ok', 'imperva-ok', 'cf-ok', 'sucuri-404', 'imperva-500', 'datadome-404', 'sucuri-header-403', 'imperva-header-403', 'akamai-500'}) do
            ngx.print('<a href="http://fixtures.test:81/bot-protection/' .. name .. '">' .. name .. '</a>')
        end
        ngx.print('</body></html>')
    }
}
location = /bot-protection/healthy {
    default_type text/html;
    return 200 '<!doctype html><html><head><title>Readable protected pages</title></head><body><a href="http://fixtures.test:81/bot-protection/sucuri-ok">Sucuri 200</a><a href="http://fixtures.test:81/bot-protection/imperva-ok">Imperva 200</a><a href="http://fixtures.test:81/bot-protection/cf-ok">Cloudflare 200</a></body></html>';
}
location = /bot-protection/sucuri-ok { add_header x-sucuri-id 12345 always; return 200 'Readable Sucuri page'; }
location = /bot-protection/imperva-ok { add_header x-iinfo 12345 always; add_header Set-Cookie 'incap_ses_123_456=fixture; Path=/' always; return 200 'Readable Imperva page'; }
location = /bot-protection/cf-ok { add_header cf-mitigated challenge always; return 200 '<html><title>Just a moment...</title><body>Readable cf-chl text</body></html>'; }
location = /bot-protection/internal {
    default_type text/html;
    return 200 '<!doctype html><html><head><title>Internal protection signals</title></head><body><a href="/bot-protection/waf">Protected internal page</a><a href="/bot-protection/forbidden">Forbidden internal page</a></body></html>';
}
location = /bot-protection/challenge {
    default_type text/html;
    add_header cf-mitigated challenge always;
    return 403 '<!doctype html><html><head><title>Just a moment...</title></head><body>Automated checks must pass a challenge.</body></html>';
}
location = /bot-protection/cf-body { return 403 '<html><body><script src="/cdn-cgi/challenge-platform/cf-chl.js"></script></body></html>'; }
location = /bot-protection/cf-title {
    content_by_lua_block { ngx.header['Server'] = 'cloudflare'; ngx.status = 403; ngx.print('<html><title>Just a moment...</title></html>') }
}
location = /bot-protection/waf {
    content_by_lua_block { ngx.header['Server'] = 'cloudflare'; ngx.status = 403; ngx.print('<html><title>Attention Required! | Cloudflare</title><body>Sorry, you have been blocked.</body></html>') }
}
location = /bot-protection/waf-marker {
    content_by_lua_block { ngx.header['Server'] = 'cloudflare'; ngx.status = 403; ngx.print('<html><body><div id="cf-error-details">Blocked</div></body></html>') }
}
location = /bot-protection/akamai {
    content_by_lua_block { ngx.header['Server'] = 'AkamaiGHost'; ngx.status = 403; ngx.print('<html><title>Access Denied</title><body>Reference #18.abc123.12345</body></html>') }
}
location = /bot-protection/sucuri { add_header x-sucuri-id 12345 always; return 403 '<html><title>Access Denied - Sucuri Website Firewall</title><body>Access denied</body></html>'; }
location = /bot-protection/sucuri-server {
    content_by_lua_block { ngx.header['Server'] = 'Sucuri/Cloudproxy'; ngx.status = 403; ngx.print('<html><title>Access Denied - Sucuri Website Firewall</title><body>Access denied</body></html>') }
}
location = /bot-protection/imperva { add_header x-iinfo 12345 always; return 403 '<html><body>Incapsula incident ID: 123456</body></html>'; }
location = /bot-protection/imperva-cookie { add_header Set-Cookie 'incap_ses_123_456=fixture; Path=/' always; return 403 '<html><body>Incapsula incident ID: 123456</body></html>'; }
location = /bot-protection/imperva-body { return 403 '<html><body>Incapsula incident ID: 123456</body></html>'; }
location = /bot-protection/datadome { add_header x-datadome protected always; return 403 'DataDome block'; }
location = /bot-protection/datadome-b { add_header x-dd-b protected always; return 403 'DataDome block'; }
location = /bot-protection/sucuri-heading { return 403 '<html><h1>Sucuri Website Firewall</h1><body>Your support ID is: 123456</body></html>'; }
location = /bot-protection/sucuri-404 { add_header x-sucuri-id 12345 always; return 404 'Not found'; }
location = /bot-protection/imperva-500 { add_header x-iinfo 12345 always; add_header Set-Cookie 'incap_ses_123_456=fixture; Path=/' always; return 500 'Origin failed'; }
location = /bot-protection/datadome-404 { add_header x-datadome protected always; add_header x-dd-b protected always; return 404 'Not found'; }
location = /bot-protection/sucuri-header-403 { add_header x-sucuri-id 12345 always; return 403 'Forbidden'; }
location = /bot-protection/imperva-header-403 { add_header x-iinfo 12345 always; add_header Set-Cookie 'incap_ses_123_456=fixture; Path=/' always; return 403 'Forbidden'; }
location = /bot-protection/akamai-500 {
    content_by_lua_block { ngx.header['Server'] = 'AkamaiGHost'; ngx.status = 500; ngx.print('<html><title>Access Denied</title><body>Reference #18.abc123.12345</body></html>') }
}
location = /bot-protection/forbidden { return 403 'Forbidden'; }
location = /bot-protection/rate-limited { return 429 'Too Many Requests'; }
location = /bot-protection/transition-root {
    default_type text/html;
    return 200 '<!doctype html><html><head><title>Previously broken link</title></head><body><a href="http://fixtures.test:81/bot-protection/transition-target">Changing access policy</a></body></html>';
}
location = /bot-protection/transition-target {
    content_by_lua_block {
        ngx.status = 403
        if ngx.shared.crawl_addon:get('bot-protection-blocked') then
            ngx.header['Server'] = 'cloudflare'
            ngx.print('<html><title>Attention Required! | Cloudflare</title><body>Blocked</body></html>')
        else
            ngx.print('Forbidden')
        end
    }
}
location = /bot-protection/prior-root {
    default_type text/html;
    content_by_lua_block {
        if ngx.shared.crawl_addon:get('bot-protection-root-blocked') then
            ngx.header['Server'] = 'cloudflare'
            ngx.status = 403
            ngx.print('<html><title>Attention Required! | Cloudflare</title><body>Blocked</body></html>')
        else
            ngx.print('<!doctype html><html><head><title>Retained finding</title></head><body><a href="/bot-protection/forbidden">Forbidden internal page</a></body></html>')
        end
    }
}
location = /bot-protection/error-root {
    default_type text/html;
    content_by_lua_block {
        if ngx.shared.crawl_addon:get('bot-protection-error-healthy') then
            ngx.print('<!doctype html><html><head><title>Verified start page</title></head><body>Site checked successfully.</body></html>')
        elseif ngx.shared.crawl_addon:get('bot-protection-error-blocked') then
            ngx.header['Server'] = 'cloudflare'
            ngx.status = 403
            ngx.print('<html><title>Attention Required! | Cloudflare</title><body>Blocked</body></html>')
        else
            ngx.status = 500
            ngx.print('Start page temporarily unavailable')
        end
    }
}
location = /bot-protection/error-state {
    content_by_lua_block {
        if ngx.req.get_method() ~= 'POST' then ngx.exit(405) end
        local blocked = ngx.var.arg_blocked
        if blocked ~= '0' and blocked ~= '1' and blocked ~= '2' then ngx.exit(400) end
        assert(ngx.shared.crawl_addon:set('bot-protection-error-blocked', blocked == '1'))
        assert(ngx.shared.crawl_addon:set('bot-protection-error-healthy', blocked == '2'))
        ngx.say('Fixture check-error policy set')
    }
}
location = /bot-protection/root-state {
    content_by_lua_block {
        if ngx.req.get_method() ~= 'POST' then ngx.exit(405) end
        local blocked = ngx.var.arg_blocked
        if blocked ~= '0' and blocked ~= '1' then ngx.exit(400) end
        assert(ngx.shared.crawl_addon:set('bot-protection-root-blocked', blocked == '1'))
        ngx.say('Fixture root policy set')
    }
}
location = /bot-protection/state {
    content_by_lua_block {
        if ngx.req.get_method() ~= 'POST' then ngx.exit(405) end
        local blocked = ngx.var.arg_blocked
        if blocked ~= '0' and blocked ~= '1' then ngx.exit(400) end
        assert(ngx.shared.crawl_addon:set('bot-protection-blocked', blocked == '1'))
        ngx.say('Fixture access policy set')
    }
}
location = /bot-protection/sitemap.xml {
    default_type application/xml;
    return 200 '<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>http://fixtures.test:81/bot-protection/challenge</loc></url><url><loc>http://fixtures.test:81/bot-protection/waf</loc></url><url><loc>http://fixtures.test:81/bot-protection/rate-limited</loc></url><url><loc>http://fixtures.test:81/bot-protection/forbidden</loc></url></urlset>';
}
location = /bot-protection/rate-root {
    default_type text/html;
    return 200 '<html><title>Rate-limit retention</title><body><a href="/bot-protection/rate-target">Internal target</a><a href="http://fixtures.test:81/bot-protection/rate-target">External target</a></body></html>';
}
location = /bot-protection/rate-target {
    default_type text/html;
    content_by_lua_block {
        local mode = ngx.shared.crawl_addon:get('bot-protection-rate-mode') or '0'
        if mode == '1' then ngx.status = 429; ngx.print('Too Many Requests')
        elseif mode == '2' then ngx.print('<html><title>Verified target</title><body>Readable</body></html>')
        else ngx.status = 404; ngx.print('Not found') end
    }
}
location = /bot-protection/rate-state {
    content_by_lua_block {
        if ngx.req.get_method() ~= 'POST' then ngx.exit(405) end
        local mode = ngx.var.arg_mode
        if mode ~= '0' and mode ~= '1' and mode ~= '2' then ngx.exit(400) end
        assert(ngx.shared.crawl_addon:set('bot-protection-rate-mode', mode))
        ngx.say('Fixture rate-limit policy set')
    }
}
location = /bot-protection/rate-sitemap.xml {
    default_type application/xml;
    return 200 '<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>http://fixtures.test/bot-protection/rate-target</loc></url></urlset>';
}
location = /bot-protection/waf-sitemap.xml {
    default_type application/xml;
    return 200 '<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>http://fixtures.test/bot-protection/transition-target</loc></url></urlset>';
}
location = /bot-protection/vendor-errors.xml {
    default_type application/xml;
    return 200 '<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>http://fixtures.test/bot-protection/sucuri-404</loc></url><url><loc>http://fixtures.test/bot-protection/imperva-500</loc></url><url><loc>http://fixtures.test/bot-protection/datadome-404</loc></url></urlset>';
}
location = /bot-protection/reclassify-root {
    default_type text/html;
    return 200 '<html><title>Reclassification</title><body><a href="/bot-protection/reclassify-target">Previously broken link</a></body></html>';
}
location = /bot-protection/reclassify-target {
    default_type text/html;
    content_by_lua_block {
        local mode = ngx.shared.crawl_addon:get('bot-protection-reclassify-mode') or '0'
        if mode == '1' then
            ngx.status = 403; ngx.header['Server'] = 'cloudflare'
            ngx.print('<html><title>Attention Required! | Cloudflare</title><body>Blocked</body></html>')
        elseif mode == '2' then ngx.status = 429; ngx.print('Too Many Requests')
        else ngx.status = 404; ngx.print('Not found') end
    }
}
location = /bot-protection/reclassify-state {
    content_by_lua_block {
        if ngx.req.get_method() ~= 'POST' then ngx.exit(405) end
        local mode = ngx.var.arg_mode
        if mode ~= '0' and mode ~= '1' and mode ~= '2' then ngx.exit(400) end
        assert(ngx.shared.crawl_addon:set('bot-protection-reclassify-mode', mode))
        ngx.say('Fixture reclassification policy set')
    }
}
location = /bot-protection/reclassify-sitemap.xml {
    default_type application/xml;
    return 200 '<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>http://fixtures.test/bot-protection/reclassify-target</loc></url></urlset>';
}
location = /bot-protection/reclassify-target-two { content_by_lua_block { ngx.exec('/bot-protection/reclassify-target') } }
location = /bot-protection/reclassify-root-two {
    default_type text/html;
    return 200 '<html><title>Plural reclassification</title><body><a href="/bot-protection/reclassify-target">First link</a><a href="/bot-protection/reclassify-target-two">Second link</a></body></html>';
}
location = /bot-protection/reclassify-sitemap-two.xml {
    default_type application/xml;
    return 200 '<?xml version="1.0"?><urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"><url><loc>http://fixtures.test/bot-protection/reclassify-target</loc></url><url><loc>http://fixtures.test/bot-protection/reclassify-target-two</loc></url></urlset>';
}
