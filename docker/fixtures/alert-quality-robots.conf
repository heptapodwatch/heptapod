server {
    listen 80;
    server_name alert-quality-missing.fixtures.test;
    include /fixtures/alert-quality.conf;
    location = /robots.txt {
        content_by_lua_block {
            local base = 'http://alert-quality-missing.fixtures.test'
            local state = ngx.shared.crawl_addon:get('truth:robots')
            if state == 'broken-only' then ngx.print('User-agent: *\nSitemap: ' .. base .. '/alert-quality/broken-three.xml\n')
            elseif state == 'valid-then-broken' then ngx.print('User-agent: *\nSitemap: ' .. base .. '/alert-quality/valid.xml\nSitemap: ' .. base .. '/alert-quality/broken-three.xml\n')
            else ngx.print('User-agent: *\nSitemap: ' .. base .. '/sitemap.xml\n') end
        }
    }
    location / { return 404; }
}
server {
    listen 80;
    server_name alert-quality-robots.fixtures.test;
    include /fixtures/alert-quality.conf;
    location = /robots.txt { return 200 'User-agent: *\nSitemap: http://alert-quality-robots.fixtures.test/alert-quality/valid.xml\n'; }
    location / { return 404; }
}
